name: keepalive
on:
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm i playwright-core
      - run: node keepalive.mjs
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
